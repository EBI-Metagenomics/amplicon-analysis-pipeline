---
# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/yaml-schema.json
name: "cutadapt"
description: Trim adapters and primers from sequencing reads
keywords:
  - sequencing
  - primer
  - trimming
  - qc
  - adapter
tools:
  - "cutadapt":
      description: "Trim adapters and primers from sequencing reads"
      homepage: "https://cutadapt.readthedocs.io/en/stable/"
      documentation: "https://cutadapt.readthedocs.io/en/stable/"
      tool_dev_url: "https://github.com/marcelm/cutadapt"
      doi: "10.14806/ej.17.1.200"
      licence: ["MIT"]

input:
  - meta:
      type: map
      description: |
        Groovy Map containing sample information
        e.g. `[ id:'test', single_end:false ]`
  - reads:
      type: file
      description: List of fastq read files
      pattern: "*.{fastq, fastq.gz}"
  - primers:
      type: file
      description: |
        List of four primer fasta files, any of which may be empty:
        `[ fwd, rev, fwd_rc, rev_rc ]`, as written by PREP_CUTADAPT_PRIMERS
        (`XN{n}PRIMER` for fwd/rev, `RC(PRIMER)N{n}X` for the _rc files).
        A first pass trims fwd (and rev from R2) from the 5' end, a second
        pass trims rev_rc (and fwd_rc from R2) from the 3' end.
        An empty list skips trimming and writes empty placeholder outputs.
      pattern: "*.fasta"

output:
  - meta:
      type: map
      description: |
        Groovy Map containing sample information
        e.g. `[ id:'test', single_end:false ]`
  - reads:
      type: file
      description: List of trimmed reads files
      pattern: "*.fastq.gz"
  - log:
      type: file
      description: Log file containing stdout from cutadapt
      pattern: "*.log"
  - json:
      type: file
      description: cutadapt JSON reports, one per pass
      pattern: "*.{first_pass,second_pass}.cutadapt.json"
  - versions:
      type: file
      description: File containing software versions
      pattern: "versions.yml"

authors:
  - "@chrisata"
